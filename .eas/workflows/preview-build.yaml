name: Smart Deploy (Preview)
on:
  push:
    branches:
      - main

jobs:
  deploy_update:
    name: Fast OTA Update
    type: update
    if: "!contains(changed_files, 'package.json') && !contains(changed_files, 'app.json')"
    params:
      branch: preview
      message: "Automated OTA update from EAS Workflows"

  trigger_build:
    name: Trigger New APK Build
    type: build
    if: "contains(changed_files, 'package.json') || contains(changed_files, 'app.json')"
    params:
      platform: android
      profile: preview
